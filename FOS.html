<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FriendsMenu — Hostel Food Ordering System</title>
<link rel="stylesheet" href="./FOS.css">
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">HB</div>
    <div>
      <h1>FriendsMenu</h1>
      <p>Hostel Food Ordering System</p>
    </div>
  </div>
  <div class="role-toggle">
    <button id="btn-student" class="active">Student</button>
    <button id="btn-admin">Admin</button>
  </div>
</header>

<main>

  <!-- ================= STUDENT VIEW ================= -->
  <section id="view-student" class="view active">
    <p class="eyebrow">Today's mess menu</p>
    <h2 class="section-title">Browse &amp; order</h2>

    <div class="student-grid">
      <div>
        <div class="category-tabs" id="category-tabs"></div>
        <div class="menu-grid" id="menu-grid"></div>
      </div>

      <div class="slip">
        <h3>Order Slip</h3>
        <div class="sub" id="cart-count">0 ITEMS</div>
        <div id="cart-items"></div>
        <div class="slip-total">
          <span>Total</span>
          <span id="cart-total">₹0</span>
        </div>
        <button class="place-order-btn" id="place-order-btn" disabled>Place Order</button>
      </div>
    </div>

    <div class="orders-section">
      <p class="eyebrow">Order tracking</p>
      <h2 class="section-title">My orders</h2>
      <div id="my-orders"></div>
    </div>
  </section>

  <!-- ================= ADMIN VIEW ================= -->
  <section id="view-admin" class="view">
    <p class="eyebrow">Back of house</p>
    <h2 class="section-title">Manage menu &amp; orders</h2>

    <div class="admin-grid">
      <div class="admin-panel">
        <h3>Add a menu item</h3>
        <form id="add-item-form">
          <div class="field">
            <label for="i-name">Item name</label>
            <input id="i-name" type="text" placeholder="e.g. Paneer Butter Masala" required>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="i-price">Price (₹)</label>
              <input id="i-price" type="number" min="1" placeholder="80" required>
            </div>
            <div class="field">
              <label for="i-cat">Category</label>
              <select id="i-cat">
                <option>Breakfast</option>
                <option>Lunch</option>
                <option>Dinner</option>
                <option>Snacks</option>
              </select>
            </div>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" id="i-veg" checked>
            <label for="i-veg" style="margin:0;">Vegetarian</label>
          </div>
          <button type="submit" class="submit-btn">Add to menu</button>
        </form>
      </div>

      <div class="admin-list">
        <div class="admin-list-header">Menu items</div>
        <div id="admin-item-list"></div>
      </div>
    </div>

    <div style="margin-top:32px;" class="admin-list">
      <div class="admin-list-header">Incoming orders</div>
      <div id="admin-order-list"></div>
    </div>
  </section>

</main>

<footer>Front-end demo — data resets on page reload. Built with HTML, CSS &amp; JavaScript.</footer>

<script src="./FOS.js"></script>
</body>
</html>
